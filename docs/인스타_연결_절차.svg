<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
<title id="title">말씀카드 인스타 계정 연결 순서</title><desc id="desc">프로페셔널 계정 전환, Meta 앱과 테스터 등록, 장기 토큰 발급, 말씀카드 설정에서 계정 확인, ImgBB 키 저장, 테스트 게시 순서입니다.</desc>
<rect width="860" height="360" rx="20" fill="#f7f3ec"/>
<g font-family="sans-serif" text-anchor="middle" fill="#2b2b2b"><text x="430" y="40" font-size="23">처음 한 번, 관리자가 계정을 연결합니다</text>
<g fill="#ffffff" stroke="#8a6d3b" stroke-width="2"><rect x="25" y="75" width="250" height="100" rx="12"/><rect x="305" y="75" width="250" height="100" rx="12"/><rect x="585" y="75" width="250" height="100" rx="12"/><rect x="25" y="220" width="250" height="100" rx="12"/><rect x="305" y="220" width="250" height="100" rx="12"/><rect x="585" y="220" width="250" height="100" rx="12"/></g>
<g font-size="19"><text x="150" y="114">① 프로페셔널 계정</text><text x="150" y="148">인스타 설정에서 전환</text><text x="430" y="114">② Meta 앱 만들기</text><text x="430" y="148">테스터 추가 · 초대 수락</text><text x="710" y="114">③ 장기 토큰 발급</text><text x="710" y="148">실제 만료일 확인</text><text x="150" y="259">④ 말씀카드 설정</text><text x="150" y="293">토큰 입력 · 연결 테스트</text><text x="430" y="259">⑤ ImgBB 키 저장</text><text x="430" y="293">이미지 임시 호스팅</text><text x="710" y="259">⑥ 테스트 계정 게시</text><text x="710" y="293">확인 후 교회 계정 연결</text></g></g>
</svg>
