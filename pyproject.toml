[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcard"
version = "0.1.0"
description = "교회를 위한 오프라인 말씀카드 생성기"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["Pillow>=11,<13", "PySide6>=6.8,<7", "keyring>=25,<26"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.gui-scripts]
wordcard = "wordcard.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
