name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm packaging/wordcard.spec
      - run: iscc packaging/windows.iss
      - shell: pwsh
        run: |
          $installer = Get-Item dist/installer/WordCard-Setup.exe
          if ($installer.Length -gt 200MB) { throw 'Installer exceeds 200 MB' }
          Compress-Archive -Path dist/WordCard -DestinationPath dist/WordCard-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WordCard-Windows
          path: |
            dist/WordCard-Windows.zip
            dist/installer/WordCard-Setup.exe
